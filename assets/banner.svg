<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">C2 decision latency</title>
  <desc id="d">Banner. A 48 second time-to-impact bar fills stage by stage: track, identify, decide, effect, leaving an 8 second decision margin.</desc>
  <style>
    .display { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -0.01em; }
    .sans { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: 0.08em; fill: #5F6B7C; }

    .seg { transform-box: fill-box; transform-origin: left center; animation: fill 10.0s linear infinite both; }
    .threat { animation: close 10.0s linear infinite both; }
    @keyframes close { 0% { transform: translateX(0px); } 75% { transform: translateX(420px); } 100% { transform: translateX(420px); } }
    @keyframes f0 { 0% { transform: scaleX(0); } 0.00% { transform: scaleX(0); } 7.81% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .s0 { animation-name: f0; }
    @keyframes f1 { 0% { transform: scaleX(0); } 7.81% { transform: scaleX(0); } 23.44% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .s1 { animation-name: f1; }
    @keyframes f2 { 0% { transform: scaleX(0); } 23.44% { transform: scaleX(0); } 54.69% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .s2 { animation-name: f2; }
    @keyframes f3 { 0% { transform: scaleX(0); } 54.69% { transform: scaleX(0); } 62.50% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .s3 { animation-name: f3; }
    @keyframes f4 { 0% { transform: scaleX(0); } 62.50% { transform: scaleX(0); } 75.00% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
    .s4 { animation-name: f4; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
  <rect width="1200" height="400" fill="#F5F7FA"/>
  <text x="64.0" y="84.0" class="mono" font-size="13" fill="#5F6B7C" text-anchor="start" font-weight="400" letter-spacing="0.12em">DARKANALYTICA</text>
  <rect x="64" y="112" width="56" height="3" fill="#0B2545"/>
  <text x="64.0" y="180.0" class="display" font-size="46" fill="#0E1726" text-anchor="start" font-weight="600" >C2 Decision Latency</text>
  <text x="64.0" y="236.0" class="sans" font-size="19" fill="#3D4A5C" text-anchor="start" font-weight="400" >Does the loop close before the threat</text>
  <text x="64.0" y="264.0" class="sans" font-size="19" fill="#3D4A5C" text-anchor="start" font-weight="400" >arrives? Time budgets, decision margin</text>
  <text x="64.0" y="292.0" class="sans" font-size="19" fill="#3D4A5C" text-anchor="start" font-weight="400" >and the arithmetic of a raid.</text>
  <text x="64.0" y="352.0" class="mono" font-size="13" fill="#5F6B7C" text-anchor="start" font-weight="400" >M = T_impact − ΣT_i</text>
  <text x="700.0" y="118.0" class="mono" font-size="12" fill="#5F6B7C" text-anchor="start" font-weight="400" letter-spacing="0.06em">FPV · 150 km/h · DETECTED AT 2 km · 48 s</text>
  <line x1="700" y1="160" x2="1120" y2="160" stroke="#D8DEE6" stroke-width="1.5"/>
  <text x="700.0" y="150.0" class="mono" font-size="12" fill="#5F6B7C" text-anchor="start" font-weight="400" >2,000 m</text>
  <text x="1120.0" y="150.0" class="mono" font-size="12" fill="#5F6B7C" text-anchor="end" font-weight="400" >asset</text>
  <g class="threat"><path d="M 693 153 L 707 160 L 693 167 Z" fill="#8A6A1F"/></g>
  <rect x="700" y="196" width="420" height="34" fill="#FFFFFF" stroke="#D8DEE6" stroke-width="1.5"/>
  <rect class="seg s0" x="700.0" y="196" width="43.8" height="34" fill="#EEF2F5" stroke="#3E5C76" stroke-width="1.25"/>
  <text x="721.9" y="252.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="middle" font-weight="400" >track</text>
  <text x="721.9" y="218.0" class="mono" font-size="12" fill="#0E1726" text-anchor="middle" font-weight="500" >5 s</text>
  <rect class="seg s1" x="743.8" y="196" width="87.5" height="34" fill="#EEF2F5" stroke="#3E5C76" stroke-width="1.25"/>
  <text x="787.5" y="252.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="middle" font-weight="400" >identify</text>
  <text x="787.5" y="218.0" class="mono" font-size="12" fill="#0E1726" text-anchor="middle" font-weight="500" >10 s</text>
  <rect class="seg s2" x="831.2" y="196" width="175.0" height="34" fill="#F4EFE2" stroke="#8A6A1F" stroke-width="1.25"/>
  <text x="918.8" y="252.0" class="mono" font-size="12" fill="#8A6A1F" text-anchor="middle" font-weight="400" >decide</text>
  <text x="918.8" y="218.0" class="mono" font-size="12" fill="#0E1726" text-anchor="middle" font-weight="500" >20 s</text>
  <rect class="seg s3" x="1006.2" y="196" width="43.8" height="34" fill="#EEF2F5" stroke="#3E5C76" stroke-width="1.25"/>
  <text x="1028.1" y="252.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="middle" font-weight="400" >effect</text>
  <text x="1028.1" y="218.0" class="mono" font-size="12" fill="#0E1726" text-anchor="middle" font-weight="500" >5 s</text>
  <rect class="seg s4" x="1050.0" y="196" width="70.0" height="34" fill="#E9F2F2" stroke="#2F6F73" stroke-width="1.25"/>
  <text x="1085.0" y="252.0" class="mono" font-size="12" fill="#3D4A5C" text-anchor="middle" font-weight="400" >margin</text>
  <text x="1085.0" y="218.0" class="mono" font-size="12" fill="#0E1726" text-anchor="middle" font-weight="500" >8 s</text>
  <text x="700.0" y="318.0" class="sans" font-size="13" fill="#5F6B7C" text-anchor="start" font-weight="400" >decide is half the chain: authority, not sensing,</text>
  <text x="700.0" y="338.0" class="sans" font-size="13" fill="#5F6B7C" text-anchor="start" font-weight="400" >is usually the binding stage.</text>
</svg>
